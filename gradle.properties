# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9: обход несовместимости с KMP androidTarget() (см. kotl.in/gradle/agp-new-kmp).
# Бэклог: разделить на :shared (KMP library) + тонкий :androidApp (application).
android.newDsl=false
android.builtInKotlin=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
